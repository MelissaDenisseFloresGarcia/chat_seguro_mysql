<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Seguro CIA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f7;
            color: #1e293b;
        }

        .app {
            width: min(900px, 94%);
            margin: 30px auto;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        header {
            background: #172554;
            color: white;
            padding: 22px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 25px;
        }

        header p {
            margin: 0;
            opacity: 0.85;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        select,
        input,
        button {
            font: inherit;
        }

        select,
        input {
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            padding: 10px;
        }

        #messages {
            min-height: 420px;
            max-height: 520px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            max-width: 72%;
            margin-bottom: 15px;
            padding: 12px 14px;
            border-radius: 14px;
            background: #e2e8f0;
        }

        .mine {
            margin-left: auto;
            background: #dbeafe;
        }

        .meta {
            font-size: 12px;
            color: #475569;
            margin-bottom: 6px;
        }

        .text {
            font-size: 16px;
            line-height: 1.4;
            word-break: break-word;
        }

        .status {
            margin-top: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .not-verified {
            color: #b45309;
        }

        .verified {
            color: #15803d;
        }

        .invalid {
            color: #b91c1c;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 18px 20px;
            border-top: 1px solid #e2e8f0;
        }

        form input {
            flex: 1;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .empty {
            text-align: center;
            color: #64748b;
            margin-top: 170px;
        }
    </style>
</head>

<body>
<div class="app">

    <header>
        <h1>Chat Seguro</h1>
        <p>Cifrado e integridad mediante CIA API + MySQL</p>
    </header>

    <div class="toolbar">
        <label for="currentUser">
            <strong>Hablar como:</strong>
        </label>

        <select id="currentUser">
            <option value="Usuario A">Usuario A</option>
            <option value="Usuario B">Usuario B</option>
        </select>
    </div>

    <div id="messages"></div>

    <form id="messageForm">
        <input
            id="messageInput"
            type="text"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
            required
        >
        <button type="submit">Enviar</button>
    </form>

</div>

<script>
    const messagesContainer = document.getElementById("messages");
    const currentUserSelect = document.getElementById("currentUser");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");

    function receiverFor(sender) {
        return sender === "Usuario A"
            ? "Usuario B"
            : "Usuario A";
    }

    async function loadMessages() {
        try {
            const response = await fetch("/messages");

            if (!response.ok) {
                throw new Error("No se pudieron obtener los mensajes");
            }

            const messages = await response.json();

            messagesContainer.innerHTML = "";

            if (messages.length === 0) {
                messagesContainer.innerHTML =
                    '<div class="empty">Todavía no hay mensajes.</div>';
                return;
            }

            const currentUser = currentUserSelect.value;

            for (const item of messages) {
                const box = document.createElement("div");

                box.className =
                    "message" +
                    (item.sender === currentUser ? " mine" : "");

                // El requisito pide mostrar primero "No verificado".
                box.innerHTML = `
                    <div class="meta">
                        ${escapeHtml(item.sender)}
                        →
                        ${escapeHtml(item.receiver)}
                        ·
                        ${escapeHtml(item.timestamp)}
                    </div>

                    <div class="text">
                        ${escapeHtml(item.message)}
                    </div>

                    <div
                        class="status not-verified"
                        id="status-${item.id}"
                    >
                        No verificado
                    </div>
                `;

                messagesContainer.appendChild(box);

                // Dejamos visible "No verificado" un momento y
                // posteriormente hacemos la llamada de verificación.
                setTimeout(
                    () => verifyMessage(item.id),
                    700
                );
            }

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        } catch (error) {
            messagesContainer.innerHTML =
                '<div class="empty">Error al cargar el chat.</div>';
        }
    }

    async function verifyMessage(id) {
        const statusElement =
            document.getElementById(`status-${id}`);

        if (!statusElement) {
            return;
        }

        try {
            const response = await fetch(
                `/messages/${id}/verify`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            if (data.valid === true) {
                statusElement.textContent =
                    "Mensaje verificado";

                statusElement.className =
                    "status verified";
            } else {
                statusElement.textContent =
                    "Mensaje no válido";

                statusElement.className =
                    "status invalid";
            }

        } catch (error) {
            statusElement.textContent =
                "Error al verificar";

            statusElement.className =
                "status invalid";
        }
    }

    messageForm.addEventListener(
        "submit",
        async (event) => {
            event.preventDefault();

            const sender =
                currentUserSelect.value;

            const receiver =
                receiverFor(sender);

            const message =
                messageInput.value.trim();

            if (!message) {
                return;
            }

            try {
                const response = await fetch(
                    "/messages",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            sender,
                            receiver,
                            message
                        })
                    }
                );

                if (!response.ok) {
                    const errorData =
                        await response.json();

                    alert(
                        errorData.detail ||
                        "No se pudo enviar."
                    );

                    return;
                }

                messageInput.value = "";

                await loadMessages();

            } catch (error) {
                alert(
                    "No se pudo comunicar con el servidor del chat."
                );
            }
        }
    );

    currentUserSelect.addEventListener(
        "change",
        loadMessages
    );

    function escapeHtml(text) {
        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

    // Primera lectura desde la base de datos.
    loadMessages();

    // Actualiza el chat cada 3 segundos para poder
    // usar Usuario A y Usuario B en dos pestañas.
    setInterval(loadMessages, 3000);
</script>
</body>
</html>
